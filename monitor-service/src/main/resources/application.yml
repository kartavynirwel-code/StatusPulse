server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: monitor-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:statuspulse}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:secretpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  alert-service-url: ${ALERT_SERVICE_URL:http://localhost:8000/alert}

logging:
  level:
    com.statuspulse.monitor: INFO
