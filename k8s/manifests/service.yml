apiVersion: v1
kind: Service
metadata:
  name: db-service
spec:
  selector:
    app: statuspulse-db
  ports:
    - protocol: TCP
      port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
spec:
  selector:
    app: statuspulse-monitoring
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: alerting-service
spec:
  selector:
    app: statuspulse-alerting
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: statuspulse-frontend
  ports:
    - protocol: TCP
      port: 3000
      nodePort: 30080
  type: NodePort